[package]
name = "rustmoe-backend-llama"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "llama.cpp reference execution backend for RustMoE"

[features]
default = []
llama = []

[lib]
name = "rustmoe_backend_llama"
path = "src/lib.rs"

[dependencies]
rustmoe-backend = { path = "../backend", version = "0.1.0" }
rustmoe-model = { path = "../model", version = "0.1.0" }
serde.workspace = true
thiserror.workspace = true

[build-dependencies]
cc = "1"
