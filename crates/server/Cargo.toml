[package]
name = "rustmoe-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RustMoE CLI and OpenAI-compatible HTTP server"

[[bin]]
name = "rustmoe"
path = "src/main.rs"

[features]
default = []
llama = ["dep:rustmoe-backend-llama", "rustmoe-backend-llama/llama"]

[dependencies]
rustmoe-backend-llama = { path = "../backend-llama", version = "0.1.0", optional = true }
rustmoe-attention = { path = "../attention", version = "0.1.0" }
rustmoe-backend = { path = "../backend", version = "0.1.0" }
rustmoe-expert-cache = { path = "../expert-cache", version = "0.1.0" }
rustmoe-gguf = { path = "../gguf", version = "0.1.0" }
rustmoe-inference = { path = "../inference", version = "0.1.0" }
rustmoe-memory = { path = "../memory", version = "0.1.0" }
rustmoe-model = { path = "../model", version = "0.1.0" }
rustmoe-quant = { path = "../quant", version = "0.1.0" }
rustmoe-scheduler = { path = "../scheduler", version = "0.1.0" }
rustmoe-telemetry = { path = "../telemetry", version = "0.1.0" }
rustmoe-tokenizer = { path = "../tokenizer", version = "0.1.0" }
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
glob = "0.3"
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wait-timeout = "0.2"

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
tempfile = "3"
